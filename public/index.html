<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00a884" />
  <meta name="description" content="Conecta Chat: mensajeria en tiempo real con fotos, videos, audios y archivos." />
  <title>Conecta Chat</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================ ACCESO ============================ -->
  <section class="auth" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">💬</div>
      <h1>Conecta Chat</h1>
      <p class="muted">Mensajes, fotos, audios y llamadas de voz. En tiempo real.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="App.authTab('login')">Entrar</button>
        <button class="auth-tab" id="tabRegister" onclick="App.authTab('register')">Crear cuenta</button>
      </div>

      <div id="registerFields" class="hidden">
        <label class="field"><span>Nombre</span><input id="regName" type="text" autocomplete="name" placeholder="Tu nombre" /></label>
      </div>
      <label class="field"><span>Numero de telefono</span><input id="authPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="3001234567" /></label>
      <label class="field"><span>Contrasena</span><input id="authPassword" type="password" autocomplete="current-password" placeholder="Minimo 4 caracteres" /></label>

      <button class="btn primary" id="authSubmit" onclick="App.submitAuth()">Entrar</button>
      <p class="auth-error" id="authError"></p>
    </div>
  </section>

  <!-- ============================ APP ============================ -->
  <section class="app hidden" id="appScreen">
    <!-- Lista de chats -->
    <div class="view" id="listView">
      <header class="topbar">
        <div class="brand">Conecta Chat</div>
        <div class="top-actions">
          <button class="iconbtn" onclick="App.openNewChat()" title="Nuevo chat">＋</button>
          <button class="iconbtn" onclick="App.openProfile()" title="Mi perfil" id="myAvatarBtn">👤</button>
        </div>
      </header>
      <div class="searchbar"><input id="chatSearch" placeholder="Buscar chats" oninput="App.renderChats()" /></div>
      <div class="chat-list" id="chatList"></div>
      <button class="fab" onclick="App.openNewChat()" title="Nuevo chat">💬</button>
    </div>

    <!-- Conversacion -->
    <div class="view hidden" id="chatView">
      <header class="topbar chat-top">
        <button class="iconbtn" onclick="App.closeChat()" title="Atras">←</button>
        <div class="chat-head" onclick="App.openChatInfo()">
          <div class="avatar sm" id="chatAvatar"></div>
          <div>
            <div class="chat-title" id="chatTitle">Chat</div>
            <div class="chat-sub" id="chatSub"></div>
          </div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer" id="composer">
        <button class="round" onclick="App.openAttach()" title="Adjuntar">＋</button>
        <textarea id="msgInput" rows="1" placeholder="Mensaje" oninput="App.onType()"></textarea>
        <button class="round mic" id="micBtn" onclick="App.toggleRecord()" title="Grabar audio">🎤</button>
        <button class="round send hidden" id="sendBtn" onclick="App.sendText()" title="Enviar">➤</button>

        <div class="rec-bar hidden" id="recBar">
          <div class="rec-pill">
            <span id="recTime">0:00</span>
            <div class="rec-wave" id="recWave"></div>
          </div>
          <div class="rec-actions">
            <button class="rec-trash" onclick="App.discardRecording()" title="Eliminar">🗑</button>
            <button class="rec-pause" id="recPauseBtn" onclick="App.togglePauseRecord()">⏸ Pausar</button>
            <button class="rec-send" onclick="App.sendRecording()" title="Enviar">➤</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ HOJAS ============================ -->
  <div class="sheet hidden" id="sheetNewChat" onclick="if(event.target===this)App.closeSheet('sheetNewChat')">
    <div class="sheet-panel">
      <h3>Nuevo chat</h3>
      <input class="sheet-search" id="newChatSearch" placeholder="Buscar personas" oninput="App.renderNewChat()" />
      <button class="row action" onclick="App.openNewGroup()">👥 Crear grupo</button>
      <div id="newChatList" class="sheet-list"></div>
    </div>
  </div>

  <div class="sheet hidden" id="sheetGroup" onclick="if(event.target===this)App.closeSheet('sheetGroup')">
    <div class="sheet-panel">
      <h3>Nuevo grupo</h3>
      <input class="sheet-search" id="groupName" placeholder="Nombre del grupo" />
      <div id="groupMembers" class="sheet-list"></div>
      <button class="btn primary" onclick="App.createGroup()">Crear grupo</button>
    </div>
  </div>

  <div class="sheet hidden" id="sheetAttach" onclick="if(event.target===this)App.closeSheet('sheetAttach')">
    <div class="sheet-panel">
      <h3>Adjuntar</h3>
      <div class="attach-grid">
        <button class="attach-item" onclick="App.pickFile('image/*')"><span>🖼</span>Foto</button>
        <button class="attach-item" onclick="App.pickFile('video/*')"><span>🎬</span>Video</button>
        <button class="attach-item" onclick="App.pickFile('*/*')"><span>📎</span>Archivo</button>
      </div>
    </div>
  </div>

  <div class="sheet hidden" id="sheetProfile" onclick="if(event.target===this)App.closeSheet('sheetProfile')">
    <div class="sheet-panel">
      <h3>Mi perfil</h3>
      <div class="profile-head"><div class="avatar lg" id="profileAvatar"></div></div>
      <label class="field"><span>Nombre</span><input id="profileName" /></label>
      <label class="field"><span>Estado</span><input id="profileAbout" placeholder="Disponible" /></label>
      <button class="btn primary" onclick="App.saveProfile()">Guardar</button>
      <button class="btn ghost" onclick="App.logout()">Cerrar sesion</button>
    </div>
  </div>

  <div class="viewer hidden" id="viewer" onclick="App.closeViewer()">
    <img id="viewerImg" alt="Foto" />
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
