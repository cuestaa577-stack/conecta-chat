name: cleanup
# Borra los parches temporales y este mismo workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-files.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar temporales
        run: |
          git rm -f app.patch server.patch .github/workflows/restore-files.yml || true
          git config user.name "cleanup-bot"
          git config user.email "bot@local"
          git commit -m "chore: limpiar parches temporales" || true
          git push
