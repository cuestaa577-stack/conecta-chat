services:
  - type: web
    name: tramites-venezolanos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SECRET
        generateValue: true
      # El correo NO es obligatorio para entrar. Asi nadie queda bloqueado si
      # Brevo pausa la cuenta. Pon "on" para exigir el codigo por correo.
      - key: REQUIRE_EMAIL_VERIFY
        value: "off"
      - key: ADMIN_EMAIL
        value: enelextranjerovenezolanos@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
      - key: CEDULA_APP_ID
        sync: false
      - key: CEDULA_TOKEN
        sync: false
